name: "미등록 문장 패턴 제보 (익명 스켈레톤)"
description: "다듬기·띄어쓰기·의도 라우팅이 어색했던 문장을 개인정보·원문 없이 익명화된 스켈레톤으로 제보합니다."
title: "[Pattern] 미등록 문장 패턴 제보"
labels: ["sentence-pattern"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🔒 공개(Public) 저장소 · Zero-PII 익명 스켈레톤 제보 안내
        - **본 저장소는 전 세계 누구나 열람 가능한 공개(Public) 저장소입니다.** 제출한 내용은 외부 검색 및 Git 이력에 남습니다.
        - 확장 프로그램의 `[🧪 패턴 제보]` 버튼이 이메일·전화번호·계좌번호·주민번호·키·URL·경로·인용문·큰 숫자를 `{EMAIL}`, `{PHONE}`, `{ACCOUNT}`, `{SECRET}`, `{PERSON}`, `{NUM}` 등으로 자동 치환합니다.
        - **자동 치환이 놓칠 수 있는 실명(성명), 회사/조직/사내 서비스명, 내부 프로젝트명, 고유 식별자가 남아 있는지 제출 전 반드시 직접 확인·삭제해 주세요.**
  - type: input
    id: category
    attributes:
      label: "문제 유형"
      placeholder: "구어 종결·띄어쓰기·의도 오분류"
    validations:
      required: true
  - type: textarea
    id: skeleton
    attributes:
      label: "익명화된 문장 스켈레톤"
      description: "개인정보나 원문 기밀 없이 문장 구조/종결어미 형태만 남겨 주세요."
      placeholder: "이 기능 {URL} 보고 구현했는데 에러가 나는데 어떻게함?"
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: "기대했던 결과 또는 참고 사항"
      placeholder: "격식 톤 변환 시 '어떻게 하나요?'로 다듬어지길 기대함"
    validations:
      required: false
  - type: checkboxes
    id: privacy_check
    attributes:
      label: "개인정보·기밀 미포함 자가 점검"
      options:
        - label: "스켈레톤에 실제 이름, 이메일, API 키, 사내 프로젝트명, 원문 기밀이 남아 있지 않음을 확인했습니다."
          required: true

